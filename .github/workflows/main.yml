
name: Build MineManagement APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Extract ZIP files
        run: |
          find . -type f -name "*.zip" -not -path "./.git/*" -print0 | while IFS= read -r -d '' f; do
            mkdir -p extracted_project
            unzip -o "$f" -d extracted_project
          done

      - name: Find project root
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project root: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineManagement-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
