
name: Build MineManagement APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP if needed
        run: |
          find . -type f -name "*.zip" -not -path "./.git/*" -print0 | while IFS= read -r -d '' f; do
            unzip -o "$f" -d extracted_project
          done

      - name: Locate Gradle project
        run: |
          ROOT="$(find . -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -not -path './.git/*' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Gradle project files not found!"
            find . -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$ROOT")"
          while [ "$PROJECT_DIR" != "." ] && [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
            PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          done
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineManagement-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
